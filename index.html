<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONOFERO - Links Oficiais</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0a0f;
    background-image: radial-gradient(circle at top, #1a2333 0%, #0a0a0f 60%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    font-family:'Inter', sans-serif;
    color:#fff;
    padding:20px 0;
  }
  .container{width:100%;max-width:420px;padding:20px;display:flex;flex-direction:column;align-items:center;}
  .avatar-wrap{
    position:relative;
    width:210px;height:210px;border-radius:50%;padding:5px;
    background:linear-gradient(180deg, #4fc3ff, #1d4fff);
    box-shadow:0 0 30px rgba(79,195,255,0.4);
    margin-bottom:18px;
  }
  .avatar-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;background:#000;}
  h1{font-size:34px;font-weight:900;letter-spacing:1px;margin-bottom:4px;text-shadow:0 0 12px rgba(79,195,255,0.6);}
  .sub{font-size:11px;letter-spacing:4px;color:#ff2a4a;margin-bottom:28px;opacity:.9;}
  .links{width:100%;display:flex;flex-direction:column;gap:13px;}
  .btn{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg, rgba(28,8,18,0.96) 0%, rgba(18,4,12,0.96) 100%);border:1px solid #4a1a2a;border-left:3px solid #ff2040;border-radius:14px;padding:14px 16px;color:#fff;text-decoration:none;transition:0.2s;}
  .btn.roblox{border-left-color:#00a2ff;background:linear-gradient(90deg, rgba(8,18,35,0.96) 0%, rgba(8,14,28,0.96) 100%);border-color:#1a3a5a;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,30,60,0.3);}
  .btn.roblox:hover{box-shadow:0 6px 20px rgba(0,162,255,0.35);border-color:#00a2ff;}
  .btn-left{display:flex;align-items:center;gap:12px}
  .icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#111;border:1px solid #2a2a2a;font-weight:900;font-size:14px}
  .btn-text b{display:block;font-size:13px;letter-spacing:.4px}
  .btn-text span{font-size:10px;color:#ff6b84;letter-spacing:.6px;text-transform:uppercase;opacity:.9}
  .btn.roblox .btn-text span{color:#6abaff}
  .footer{text-align:center;color:#333;font-size:10px;letter-spacing:2px;margin-top:24px}
</style>
